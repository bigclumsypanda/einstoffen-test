services:
  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ci4-app
    working_dir: /var/www/html
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && php spark app:migrate"]
    volumes:
      - .:/var/www/html
    networks:
      - ci4net
    depends_on:
      db:
        condition: service_healthy

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ci4-app
    container_name: ci4-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    networks:
      - ci4net
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ci4-app
    container_name: ci4-worker
    command: ["php", "spark", "queue:work", "default", "-priority", "high,low", "-sleep", "5"]
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - ci4net
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mockoon:
        condition: service_started
      mailpit:
        condition: service_healthy

  publisher:
    image: ci4-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "spark", "outbox:publish", "--watch"]
    volumes:
      - .:/var/www/html
    networks:
      - ci4net
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: nginx:stable-alpine
    container_name: ci4-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ci4net
    depends_on:
      - app

  db:
    image: mariadb:lts
    container_name: ci4-db
    environment:
      MARIADB_DATABASE: ci4
      MARIADB_USER: ci4
      MARIADB_PASSWORD: ci4password
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mariadb/data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - ci4net

  redis:
    image: redis:8.10-alpine
    container_name: ci4-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    networks:
      - ci4net
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: ci4-phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      PMA_TRUSTED_PROXIES: 127.0.0.0/32,fd00::127:0:0:1/128
    networks:
      - ci4net
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: ci4-mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP server
    networks:
      - ci4net

  mockoon:
    image: mockoon/cli:latest
    container_name: ci4-mockoon
    command: ["--data", "/home/mockoon/data/data.json", "--port", "3000"]
    environment:
      MOCKOON_ADMIN_API_TOKEN: mockadmin
    ports:
      - "8083:3000"
    volumes:
      - ./docker/mockoon/data.json:/home/mockoon/data/data.json:readonly
    networks:
      - ci4net

networks:
  ci4net:
    driver: bridge

volumes:
  redis-data:
